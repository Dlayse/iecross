# Publica la web en GitHub Pages y la mantiene al día con IE Cross Database:
# cada 6 horas descarga los datos; si han cambiado (jugadores nuevos, versión nueva…) recalcula el
# meta de referencia, guarda los datos en el repo y vuelve a publicar.
name: Actualizar y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Descargar datos de IE Cross Database
        run: node scripts/sync.mjs

      - name: ¿Han cambiado los datos?
        id: diff
        run: |
          if git diff --quiet -- data/game.json data/coaches.json && [ -z "$(git status --porcelain -- public)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recalcular el meta de referencia
        if: steps.diff.outputs.changed == 'true'
        run: npx tsx scripts/calibrate.ts

      - name: Guardar los datos nuevos en el repositorio
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "Datos actualizados desde IE Cross Database ($(node -p "require('./data/game.json').meta.gameVersion"))"
          git push

      # En las comprobaciones programadas solo se republica si hay datos nuevos
      - name: ¿Publicar?
        id: decide
        run: echo "publish=${{ github.event_name != 'schedule' || steps.diff.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Construir la web
        if: steps.decide.outputs.publish == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
